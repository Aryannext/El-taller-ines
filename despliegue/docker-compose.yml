# El-taller-ines en el VPS compartido (docs/04-especificacion-tecnica/07-despliegue-y-operacion.md).
# Se usa desde esta carpeta. Los secretos están en despliegue/.env, que no se versiona (RNF-24).
name: taller

services:
  web:
    build:
      context: ..
      dockerfile: despliegue/Dockerfile
    image: el-taller-ines:actual
    restart: unless-stopped
    env_file: .env
    environment:
      TALLER_ROL: web
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/taller/sistema/storage
    # Solo desde el mismo servidor: Nginx lo publica en https://proyectosena.online/taller
    ports:
      - "127.0.0.1:3012:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Trabajador de la cola de avisos: si se detiene o termina su hora (--max-time), Docker lo vuelve a iniciar (HT-04, RNF-17)
  cola:
    image: el-taller-ines:actual
    pull_policy: never
    restart: always
    env_file: .env
    environment:
      TALLER_ROL: cola
    user: www-data
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - storage:/var/www/taller/sistema/storage
    command: ["php", "artisan", "queue:work", "--queue=avisos", "--sleep=3", "--max-time=3600"]

  # Las tareas de la aplicación (HT-05). Los respaldos no corren aquí sino en el cron del host:
  # mysqldump vive dentro de db y alcanzarlo desde un contenedor exigiría montarle el socket de Docker.
  programador:
    image: el-taller-ines:actual
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      TALLER_ROL: programador
    user: www-data
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - storage:/var/www/taller/sistema/storage
    command: ["php", "artisan", "schedule:work"]

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # Igual que en las pruebas: búsqueda sin tildes ni mayúsculas (BuscarClientes) y hora de Colombia
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=-05:00"]
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ADR-007: Evolution API conecta el WhatsApp que envía los avisos. Solo escucha en el servidor y exige su clave
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://127.0.0.1:3013
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DEL_INSTANCE: "false"
      LANGUAGE: es
      LOG_LEVEL: ERROR,WARN
      TELEMETRY_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: El taller
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: taller
      # Solo la sesión: no se guardan mensajes, chats, contactos ni historial del WhatsApp conectado
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    volumes:
      - evolution_instancias:/evolution/instances
    # Solo desde el servidor: para escanear el QR se abre con un túnel SSH
    ports:
      - "127.0.0.1:3013:8080"

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  storage:
  db:
  evolution_db:
  evolution_instancias:
