<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="pantalla" content="PT-10">
<meta name="historias" content="HU-18">
<meta name="criterios" content="CA-18.1, CA-18.2">
<title>PT-10 · Fotos de la orden</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="app">
  <header class="barra">
    <a class="boton-icono" href="pt-09-detalle-orden.html" aria-label="Volver"><i class="i i-atras"></i></a>
    <h1>Fotos de la <span class="numero-orden numero-chico">#0042</span><span class="sub">Marta Rincón · 3 prendas</span></h1>
  </header>

  <main class="contenido">
    <div class="banda banda-info"><i class="i i-ampliar"></i><span>Toca una foto para verla grande y comparar con las prendas del rincón.</span></div>

    <section class="seccion">
      <div class="entre"><h2 class="fuerte" style="font-size:18px">Pantalón <span class="texto-2" style="font-weight:400">· Subir basta 3 cm</span></h2><span class="chip chip-terminada">Terminada</span></div>
      <div class="fotos fotos-grandes">
        <span class="foto foto-pantalon" role="img" aria-label="Pantalón completo"></span>
        <span class="foto foto-pantalon" style="background-size:130%; background-position:50% 95%" role="img" aria-label="Detalle de la basta"></span>
      </div>
    </section>

    <section class="seccion">
      <div class="entre"><h2 class="fuerte" style="font-size:18px">Camisa <span class="texto-2" style="font-weight:400">· Entallar los costados</span></h2><span class="chip chip-terminada">Terminada</span></div>
      <div class="fotos fotos-grandes">
        <span class="foto foto-camisa" role="img" aria-label="Camisa blanca"></span>
      </div>
    </section>

    <section class="seccion">
      <div class="entre"><h2 class="fuerte" style="font-size:18px">Camisa <span class="texto-2" style="font-weight:400">· Entallar y acortar mangas</span></h2><span class="chip chip-pendiente">Pendiente</span></div>
      <div class="tarjeta entre">
        <span class="texto-2">Esta prenda no tiene fotos.</span>
        <button class="btn btn-secundario btn-pequeno"><i class="i i-camara i-sm"></i>Tomar foto</button>
      </div>
    </section>
  </main>
</div>
</body>
</html>
