# Configuración de Apache dentro del contenedor web.
# Las cabeceras de seguridad (docs/04-especificacion-tecnica/06-seguridad.md) salen de aquí y no del Nginx
# compartido del servidor, para no cambiárselas a los otros proyectos del dominio.
# «always» las envía también en las respuestas de error, que es donde más importan.

ServerTokens Prod
ServerSignature Off

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "same-origin"

# Solo se cargan guiones, estilos, fuentes e imágenes del propio sistema: un XSS que se escape no puede
# traer código de afuera. «blob:» es para la vista previa de la foto antes de subirla (HU-17), y «data:»
# para los iconos, que son SVG escritos dentro de la hoja de estilos: sin él la app se queda sin un solo
# icono. Ninguno de los dos permite ejecutar código; los guiones siguen limitados a 'self'.
Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"
