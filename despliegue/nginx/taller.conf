# El-taller-ines dentro del sitio del portafolio. Se incluye en el bloque server 443 de proyectosena.online:
#     include /home/cristian/proyectos/proyectosena.online/el-taller-ines/despliegue/nginx/taller.conf;
# ^~ impide que las location con expresiones regulares del portafolio, como la de sql-wasm, atiendan rutas de /taller.

location = /taller {
    return 301 /taller/;
}

# El enlace entre el APK y el sitio (HT-07). Android solo lo busca en la raíz del dominio, nunca bajo /taller,
# y este archivo se incluye en el server del portafolio: por eso esta location atiende la raíz de proyectosena.online.
# Lo sirve el contenedor desde sistema/public/.well-known, con 200 y application/json, sin redirecciones.
location = /.well-known/assetlinks.json {
    proxy_pass http://127.0.0.1:3012/.well-known/assetlinks.json;
    proxy_set_header Host $host;
}

location ^~ /taller/ {
    proxy_pass http://127.0.0.1:3012/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Se reemplaza, no se agrega: así nadie falsea su IP ante el límite de intentos del inicio de sesión (RNF-20)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # Laravel arma todas las direcciones con este prefijo (bootstrap/app.php)
    proxy_set_header X-Forwarded-Prefix /taller;
    # Coincide con post_max_size del contenedor: las fotos de una orden (RNF-03)
    client_max_body_size 64M;
    proxy_read_timeout 60s;
}
